<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LegalLens | AI Legal Document Companion</title>
    <meta
      name="description"
      content="Understand legal documents before you sign them. AI-powered plain language translation, clause detection, contract comparison, and lawyer preparation."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @-webkit-keyframes spin {
        0% { -webkit-transform: rotate(0deg); }
        100% { -webkit-transform: rotate(360deg); }
      }
      .spinner,
      .animate-spin,
      svg.spinner,
      svg.animate-spin,
      svg.lucide-loader-2,
      svg.lucide-loader {
        -webkit-animation: spin 0.85s linear infinite !important;
        animation: spin 0.85s linear infinite !important;
        display: inline-block !important;
        transform-origin: center center !important;
        -webkit-transform-origin: center center !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
