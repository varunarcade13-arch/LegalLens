name: LegalLens CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Build & 100% Coverage Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint

      - name: Production Build (Client & Server)
        run: npm run build

      - name: Run Test Suite with 100% Coverage Enforcement
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: test-ci-secret-key-at-least-32-chars-long
